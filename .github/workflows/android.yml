name: Android checks and signed release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and build preview
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RouteRevive-check-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: RouteRevive-preview-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  signed-release:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4

      - name: Require persistent signing secrets
        env:
          RR_KEYSTORE_BASE64: ${{ secrets.RR_KEYSTORE_BASE64 }}
          RR_STORE_PASSWORD: ${{ secrets.RR_STORE_PASSWORD }}
        run: |
          if [ -z "$RR_KEYSTORE_BASE64" ] || [ -z "$RR_STORE_PASSWORD" ]; then
            echo "::error::Add RR_KEYSTORE_BASE64 and RR_STORE_PASSWORD in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$RR_KEYSTORE_BASE64" | base64 --decode > app/routerevive-release.p12
          chmod 600 app/routerevive-release.p12

      - name: Build consistently signed release APK and AAB
        env:
          RR_SIGNING_FILE: ${{ github.workspace }}/app/routerevive-release.p12
          RR_STORE_PASSWORD: ${{ secrets.RR_STORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Remove signing key from runner workspace
        if: always()
        run: rm -f app/routerevive-release.p12

      - uses: actions/upload-artifact@v4
        with:
          name: RouteRevive-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: RouteRevive-app-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  publish-direct-apk:
    needs: signed-release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RouteRevive-signed
          path: release

      - name: Prepare stable direct APK link
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test -s release/app-release.apk
          cp release/app-release.apk release/RouteRevive.apk
          version=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          test -n "$version"
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release and direct APK asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: RouteRevive v${{ steps.version.outputs.name }}
          files: release/RouteRevive.apk
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: true
