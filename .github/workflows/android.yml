name: Android signed APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Android unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Require persistent signing secrets
        env:
          RR_KEYSTORE_BASE64: ${{ secrets.RR_KEYSTORE_BASE64 }}
          RR_STORE_PASSWORD: ${{ secrets.RR_STORE_PASSWORD }}
        run: |
          if [ -z "$RR_KEYSTORE_BASE64" ] || [ -z "$RR_STORE_PASSWORD" ]; then
            echo "::error::Add RR_KEYSTORE_BASE64 and RR_STORE_PASSWORD in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$RR_KEYSTORE_BASE64" | base64 --decode > app/routerevive-release.p12
          chmod 600 app/routerevive-release.p12

      - name: Build consistently signed release APK
        env:
          RR_SIGNING_FILE: ${{ github.workspace }}/app/routerevive-release.p12
          RR_STORE_PASSWORD: ${{ secrets.RR_STORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Remove signing key from runner workspace
        if: always()
        run: rm -f app/routerevive-release.p12

      - uses: actions/upload-artifact@v4
        with:
          name: RouteRevive-v0.0.3-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
